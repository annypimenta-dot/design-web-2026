<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cartão</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-sm rounded shadow p-4 bg-white border">
        <img src="https://placehold.co/400x200" class="rounded">

        <h2 class="text-xl font-bold mt-2">
            Meu Cartão
        </h2>

        <p class="mt-2">
            Este é um cartão simples usando Tailwind CSS.
        </p>

        <button class="bg-blue-500 text-white px-4 py-2 rounded mt-3 hover:bg-blue-700">
            Clique aqui
        </button>
    </div>
</body>
</html>
